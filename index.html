<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #E6F1FB;
  --card: #FFFFFF;
  --chip: #E6F1FB;
  --ink: #132A45;
  --muted: #4B607A;
  --line: #C9DFF3;
  --accent: #AFD3F7;
  --on-accent: #132A45;
  --deep: #1F5FA8;
  --warn: #A12B12;
  --invert-bg: #132A45;
  --invert-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1B2A;
    --card: #17273A;
    --chip: #22364D;
    --ink: #E8F1FB;
    --muted: #A9BDD3;
    --line: #2A405A;
    --accent: #AFD3F7;
    --on-accent: #132A45;
    --deep: #8FC1F2;
    --warn: #FFA08A;
    --invert-bg: #E8F1FB;
    --invert-ink: #132A45;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.6;
  word-break: keep-all;
}
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

main { margin: 0 auto; display: flex; flex-direction: column; }
main.narrow { max-width: 780px; padding: 40px 20px 88px; gap: 16px; }
main.wide { max-width: 1240px; padding: 28px 20px 72px; gap: 18px; }

.card {
  margin: 0; border: 0; min-width: 0;
  background: var(--card); border-radius: 16px; padding: 28px 34px 30px;
  display: flex; flex-direction: column; gap: 18px;
}
.card h2 { font-size: 22px; font-weight: 800; }

/* first page */
.hero { padding: 0; gap: 0; overflow: hidden; }
.band { height: 12px; background: var(--accent); }
.hero-in { padding: 30px 34px 32px; display: flex; flex-direction: column; gap: 12px; }
.meta { font-size: 15px; color: var(--muted); }
.hero h1 { font-size: clamp(36px, 5vw, 48px); line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
.goal { font-size: 19px; line-height: 1.5; }
.chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 6px 14px; border-radius: 999px; background: var(--chip); font-size: 15px; font-weight: 600; }

.defs { margin: 0; display: flex; flex-direction: column; gap: 16px; }
.defs dt { font-weight: 700; }
.defs dd { margin: 2px 0 0; color: var(--muted); }
.qdefs { display: flex; flex-direction: column; gap: 14px; }
.qdefs > div { display: flex; gap: 16px; align-items: flex-start; }
.qn {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.qdefs h3 { font-size: 17px; font-weight: 700; }
.qdefs p { margin-top: 2px; color: var(--muted); }
.steps { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 10px; }

.lang-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 15px; }
.lang-pick .label { color: var(--muted); }
.lang-pick .seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--chip); }
.lang-pick button {
  min-height: 40px; padding: 6px 18px; border: 0; border-radius: 999px;
  font-size: 15px; font-weight: 700; background: transparent; color: var(--ink);
}
.lang-pick button[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-ink); }
.start { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 20px; }
.field { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 15px; font-weight: 700; }
.field input {
  width: 100%; padding: 14px 16px; font: inherit; font-size: 17px;
  color: var(--ink); background: var(--card); border: 1.5px solid var(--muted); border-radius: 12px;
}
.error { color: var(--warn); font-size: 15px; font-weight: 600; }

button { font: inherit; cursor: pointer; }
.btn {
  min-height: 54px; padding: 12px 40px; border: 0; border-radius: 999px;
  font-size: 18px; font-weight: 800; background: var(--accent); color: var(--on-accent);
}
.btn.quiet { padding: 10px 24px; font-size: 17px; font-weight: 700; background: var(--card); color: var(--ink); border: 2px solid var(--muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.hint { font-size: 15px; color: var(--muted); }

/* comparison page */
.topline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.page-pill { padding: 8px 18px; border-radius: 999px; background: var(--card); font-size: 17px; font-weight: 800; }
.track { flex: 1 1 200px; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.track div { height: 100%; border-radius: 999px; background: var(--deep); transition: width .25s ease; }

.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
.stage { padding: 16px; gap: 12px; }
.stage .hint { padding: 0 4px; }
.stage video { width: 100%; height: auto; max-height: 76vh; display: block; background: #000; border-radius: 10px; }
.stage figcaption { font-size: 20px; line-height: 1.4; font-weight: 700; color: var(--ink); text-align: center; padding: 2px 4px 4px; }
.target { padding: 4px 4px 0; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; }
.target span { color: var(--muted); font-weight: 700; }
.missing {
  min-height: 280px; padding: 20px; background: var(--chip); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  text-align: center; font-size: 15px; color: var(--muted);
}
.missing code { font-size: 14px; color: var(--ink); word-break: break-all; }
.side { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 980px) {
  .split { grid-template-columns: minmax(0, 2fr) minmax(340px, 1fr); }
  .stage { position: sticky; top: 20px; }
}

.q { padding: 20px 22px 22px; gap: 14px; }
.q legend { float: left; width: 100%; padding: 0; }
.q-text { display: block; font-size: 17px; line-height: 1.4; font-weight: 700; }
.q-help { display: block; margin-top: 4px; font-size: 15px; color: var(--muted); }
.opts { display: flex; gap: 10px; }
.opt { flex: 1 1 0; position: relative; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt span {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px;
  border: 2px solid var(--muted); border-radius: 999px; font-size: 20px; font-weight: 800;
  background: var(--card); color: var(--ink);
}
.opt input:checked + span { background: var(--accent); border-color: var(--ink); color: var(--on-accent); }
.opt input:checked + span::before { content: "✓"; }
.opt input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
.nav { display: flex; gap: 10px; padding-top: 6px; }
.nav .btn { flex: 2 1 0; padding-left: 20px; padding-right: 20px; }
.nav .btn.quiet { flex: 1 1 0; }

/* last pages */
.end h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; }
.end .lead { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

@media (max-width: 560px) {
  .card { padding: 22px 20px 24px; }
  .hero { padding: 0; }
  .hero-in { padding: 24px 20px 26px; }
}
@media (prefers-reduced-motion: reduce) { .track div { transition: none; } }
</style>
</head>

const app = document.getElementById("app");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Decided once per session.
let order = STUDY.shuffleTrials ? shuffled(STUDY.trials) : STUDY.trials.slice();

const state = {
  view: "intro",
  lang: "en",
  index: 0,
  email: "",
  startedAt: null,
  answers: order.map(() => STUDY.questions.map(() => null)),  // "A" | "B"
  sendStatus: "idle"
};

const DRAFT_PREFIX = "user-study-draft:";

function draftKey(email) {
  return DRAFT_PREFIX + email.trim().toLowerCase();
}

function saveDraft() {
  if (!state.email || !state.startedAt || state.sendStatus === "sent") return;
  try {
    localStorage.setItem(draftKey(state.email), JSON.stringify({
      email: state.email,
      lang: state.lang,
      startedAt: state.startedAt,
      index: state.index,
      order: order.map(trial => trial.id),
      answers: state.answers
    }));
  } catch (error) {
    console.error("Could not save the study draft in this browser.", error);
  }
}

function restoreDraft(email) {
  let raw;
  try {
    raw = localStorage.getItem(draftKey(email));
  } catch (error) {
    console.error("Could not read the study draft from this browser.", error);
    return false;
  }
  if (!raw) return false;

  try {
    const draft = JSON.parse(raw);
    const trialsById = new Map(STUDY.trials.map(trial => [trial.id, trial]));
    const validOrder = Array.isArray(draft.order)
      && draft.order.length === STUDY.trials.length
      && new Set(draft.order).size === STUDY.trials.length
      && draft.order.every(id => trialsById.has(id));
    const validAnswers = Array.isArray(draft.answers)
      && draft.answers.length === STUDY.trials.length
      && draft.answers.every(row => Array.isArray(row)
        && row.length === STUDY.questions.length
        && row.every(answer => answer === null || answer === "A" || answer === "B"));

    if (draft.email.trim().toLowerCase() !== email.trim().toLowerCase()
      || !validOrder
      || !validAnswers
      || !Number.isInteger(draft.index)
      || draft.index < 0
      || draft.index >= STUDY.trials.length
      || !["en", "ko"].includes(draft.lang)
      || typeof draft.startedAt !== "string") {
      throw new Error("The saved study draft has an invalid format.");
    }

    order = draft.order.map(id => trialsById.get(id));
    state.email = email;
    state.lang = draft.lang;
    state.startedAt = draft.startedAt;
    state.index = draft.index;
    state.answers = draft.answers;
    return true;
  } catch (error) {
    console.error("Could not restore the saved study draft.", error);
    return false;
  }
}

// Text in the chosen language.
function t(value) { return value && typeof value === "object" ? (value[state.lang] ?? value.en) : value; }
function ui() { return UI[state.lang]; }

function show(view, index) {
  state.view = view;
  if (index != null) state.index = index;
  if (view === "trial" || view === "review") saveDraft();
  render();
  window.scrollTo(0, 0);
}

function changeLanguage(lang) {
  if (lang === state.lang) return;
  state.lang = lang;
  if (state.view === "trial" || state.view === "review") saveDraft();
  render();
}

function languagePicker(onSelect) {
  return h("div", { class: "lang-pick", role: "group", "aria-label": "Language" },
    h("span", { class: "label" }, "Language"),
    h("div", { class: "seg" },
      h("button", { type: "button", "aria-pressed": String(state.lang === "en"), onclick: () => onSelect("en") }, "English"),
      h("button", { type: "button", lang: "ko", "aria-pressed": String(state.lang === "ko"), onclick: () => onSelect("ko") }, "한국어")
    )
  );
}

function render() {
  document.documentElement.lang = state.lang;
  document.title = t(STUDY.heading);
  const views = { intro: viewIntro, trial: viewTrial, review: viewReview, done: viewDone };
  app.replaceChildren(views[state.view]());
}

/* ---------- 1. Description and instructions ---------- */
function viewIntro() {
  const L = ui();
  const input = h("input", { id: "email", type: "email", autocomplete: "email", inputmode: "email", value: state.email });
  const error = h("p", { class: "error", role: "alert", hidden: true }, L.emailError);

  function setLang(lang) {
    if (lang === state.lang) return;
    state.email = input.value.trim();
    changeLanguage(lang);
  }

  function start() {
    state.email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) {
      error.hidden = false;
      input.focus();
      return;
    }
    if (restoreDraft(state.email)) {
      show("trial", state.index);
      return;
    }
    state.index = 0;
    state.startedAt = null;
    state.answers = order.map(() => STUDY.questions.map(() => null));
    state.sendStatus = "idle";
    if (!state.startedAt) state.startedAt = new Date().toISOString();
    show("trial", 0);
  }

  return h("main", { class: "narrow" },
    h("header", { class: "card hero" },
      h("div", { class: "band" }),
      h("div", { class: "hero-in" },
        h("h1", {}, t(STUDY.heading)),
        h("p", { class: "goal" }, t(STUDY.goal)),
        h("p", { class: "chips" },
          h("span", {}, L.pagesChip(order.length)),
          h("span", {}, L.perPageChip(STUDY.questions.length)),
          h("span", {}, t(STUDY.estimatedTime))
        )
      )
    ),
    h("section", { class: "card" },
      h("h2", {}, L.see),
      h("dl", { class: "defs" }, STUDY.terms.map(x => h("div", {}, h("dt", {}, t(x.term)), h("dd", {}, t(x.text)))))
    ),
    h("section", { class: "card" },
      h("h2", {}, L.asks),
      h("div", { class: "qdefs" }, STUDY.questions.map((q, n) =>
        h("div", {},
          h("span", { class: "qn", "aria-hidden": "true" }, "Q" + (n + 1)),
          h("div", {}, h("h3", {}, t(q.text)), h("p", {}, t(q.help)))
        )
      ))
    ),
    h("section", { class: "card" },
      h("h2", {}, L.instructions),
      h("ol", { class: "steps" }, STUDY.instructions.map(x => h("li", {}, t(x))))
    ),
    h("section", { class: "card" },
      languagePicker(setLang),
      h("div", { class: "start" },
        h("div", { class: "field" },
          h("label", { for: "email" }, L.email),
          input,
          error
        ),
        h("button", { class: "btn", type: "button", onclick: start }, L.next)
      )
    )
  );
}

/* ---------- 2. Comparison page ---------- */
function viewTrial() {
  const L = ui();
  const i = state.index;
  const trial = order[i];
  const answers = state.answers[i];

  const video = h("video", { src: trial.video, controls: true, loop: true, autoplay: true, playsinline: true, preload: "auto" });
  video.muted = true;
  const missing = h("p", { class: "missing", hidden: true }, L.videoMissing, h("code", {}, trial.video));
  video.addEventListener("error", () => { video.hidden = true; missing.hidden = false; });

  const next = h("button", { class: "btn", type: "button", onclick: () => {
    if (answers.includes(null)) return;
    if (i + 1 < order.length) show("trial", i + 1); else show("review");
  } }, L.next);
  const hint = h("p", { class: "hint" }, L.answerAll);
  function refresh() {
    const open = answers.includes(null);
    next.disabled = open;
    hint.hidden = !open;
  }

  const questions = STUDY.questions.map((item, q) =>
    h("fieldset", { class: "card q" },
      h("legend", {},
        h("span", { class: "q-text" }, "Q" + (q + 1) + ". " + t(item.text)),
        item.help && h("span", { class: "q-help" }, t(item.help))
      ),
      h("div", { class: "opts" }, ["A", "B"].map(letter => {
        const radio = h("input", { type: "radio", name: "q" + q, value: letter, checked: answers[q] === letter,
          onchange: () => { answers[q] = letter; saveDraft(); refresh(); } });
        return h("label", { class: "opt" }, radio, h("span", {}, letter));
      }))
    )
  );

  refresh();

  return h("main", { class: "wide" },
    h("div", { class: "topline" },
      h("h1", { class: "page-pill" }, L.pageOf(i + 1, order.length)),
      h("div", { class: "track", role: "progressbar", "aria-label": L.progress, "aria-valuemin": "0", "aria-valuemax": String(order.length), "aria-valuenow": String(i + 1) },
        h("div", { style: "width: " + Math.round(((i + 1) / order.length) * 100) + "%" })
      ),
      languagePicker(changeLanguage)
    ),
    h("div", { class: "split" },
      h("figure", { class: "card stage" },
        h("p", { class: "target" }, h("span", {}, L.target + ": "), t(trial.content)),
        h("p", { class: "target" }, h("span", {}, L.style + ": "), t(trial.style)),
        h("p", { class: "hint" }, L.watchHint),
        video,
        missing,
        h("figcaption", {}, t(STUDY.videoCaption))
      ),
      h("div", { class: "side" },
        questions,
        hint,
        h("div", { class: "nav" },
          h("button", { class: "btn quiet", type: "button", onclick: () => i === 0 ? show("intro") : show("trial", i - 1) }, L.back),
          next
        )
      )
    )
  );
}

/* ---------- 3. Submit ---------- */
function buildRows() {
  return order.map((trial, i) => {
    const row = { email: state.email, language: state.lang, trial: trial.id, order: i + 1, ours_is: trial.oursIs };
    state.answers[i].forEach((letter, q) => {
      row["q" + (q + 1) + "_letter"] = letter;
      row["q" + (q + 1) + "_choice"] = letter === trial.oursIs ? "ours" : "baseline";
    });
    return row;
  });
}

function toCsv(rows) {
  const cols = Object.keys(rows[0] || {});
  const cell = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  return "\uFEFF" + [cols.map(cell).join(",")].concat(rows.map(r => cols.map(c => cell(r[c])).join(","))).join("\r\n");
}

function downloadCsv() {
  const blob = new Blob([toCsv(buildRows())], { type: "text/csv;charset=utf-8" });
  const link = h("a", { href: URL.createObjectURL(blob), download: "responses_" + state.email.replace(/[^\w.-]+/g, "_") + ".csv" });
  document.body.append(link);
  link.click();
  link.remove();
}

async function submit() {
  if (!STUDY.submitUrl) { state.sendStatus = "no-url"; show("done"); return; }
  const payload = {
    study: STUDY.title.en,
    email: state.email,
    language: state.lang,
    startedAt: state.startedAt,
    finishedAt: new Date().toISOString(),
    responses: buildRows()
  };
  try {
    await fetch(STUDY.submitUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    state.sendStatus = "sent";
    try {
      localStorage.removeItem(draftKey(state.email));
    } catch (error) {
      console.error("Could not clear the submitted study draft from this browser.", error);
    }
  } catch (e) {
    state.sendStatus = "failed";
  }
  show("done");
}

function viewReview() {
  const L = ui();
  const send = h("button", { class: "btn", type: "button", onclick: () => { send.disabled = true; send.textContent = L.submitting; submit(); } }, L.submit);
  return h("main", { class: "narrow" },
    h("section", { class: "card end" },
      languagePicker(changeLanguage),
      h("h1", {}, L.reviewTitle),
      h("p", { class: "lead" }, L.reviewBody),
      h("div", { class: "row" },
        h("button", { class: "btn quiet", type: "button", onclick: () => show("trial", order.length - 1) }, L.back),
        send
      )
    )
  );
}

function viewDone() {
  const L = ui();
  if (state.sendStatus === "sent") {
    return h("main", { class: "narrow" },
      h("section", { class: "card end" },
        languagePicker(changeLanguage),
        h("h1", {}, L.sentTitle),
        h("p", { class: "lead" }, L.sentBody),
        h("p", {}, t(STUDY.closing))
      )
    );
  }
  if (state.sendStatus === "failed") {
    return h("main", { class: "narrow" },
      h("section", { class: "card end" },
        languagePicker(changeLanguage),
        h("h1", {}, L.failTitle),
        h("p", { class: "lead" }, L.failBody),
        h("div", { class: "row" },
          h("button", { class: "btn", type: "button", onclick: submit }, L.again),
          h("button", { class: "btn quiet", type: "button", onclick: downloadCsv }, L.download)
        )
      )
    );
  }
  return h("main", { class: "narrow" },
    h("section", { class: "card end" },
      languagePicker(changeLanguage),
      h("h1", {}, L.almostTitle),
      h("p", { class: "lead" }, L.almostBody),
      h("div", {}, h("button", { class: "btn", type: "button", onclick: downloadCsv }, L.download)),
      h("p", {}, t(STUDY.closing))
    )
  );
}

render();
